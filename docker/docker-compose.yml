services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cvewatcher_app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app:ro
      - ../requirements.txt:/app/requirements.txt:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
    depends_on:
      - db
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:16
    container_name: cvewatcher_db
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local OpenID Connect provider for trying single sign-on:
  #   docker compose --profile oidc up -d
  # Development only (admin/admin, fixed client secret, plain HTTP).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: cvewatcher_keycloak
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers use localhost:8081 (the issuer); the app reaches
      # keycloak:8080 inside the Docker network for tokens and keys.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
