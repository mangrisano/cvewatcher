[project]
name = "cvewatcher"
version = "2.3.1"
description = "A FastAPI-based application for monitoring and tracking CVE (Common Vulnerabilities and Exposures) vulnerabilities for your software assets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic~=1.19.0",
    "apscheduler~=3.11.3",
    "fastapi[standard]~=0.141.1",
    "httpx~=0.28.1",
    "packaging~=26.3",
    "psycopg2-binary~=2.9.12",
    "pydantic[email]~=2.13.4",
    "joserfc~=1.7.4",
    "redis~=8.1.0",
    "sqlalchemy~=2.0.51",
    "uvicorn[standard]~=0.52.1",
    "cvss~=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1.400",
]

[tool.uv]
dev-dependencies = [
    "types-sqlalchemy>=1.4.53.38",
]

[tool.ruff]
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
