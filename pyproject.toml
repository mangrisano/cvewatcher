[project]
name = "cvewatcher"
version = "0.1.1"
description = "A FastAPI-based application for monitoring and tracking CVE (Common Vulnerabilities and Exposures) vulnerabilities for your software assets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.4",
    "apscheduler>=3.10,<4.0",
    "fastapi[standard]>=0.116.1",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.11.7",
    "joserfc>=1.0.0",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
dev-dependencies = [
    "types-sqlalchemy>=1.4.53.38",
]

[tool.ruff]
line-length = 88
src = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
